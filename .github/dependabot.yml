version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      next-runtime:
        patterns:
          - next
          - react
          - react-dom
          - eslint-config-next
      testing:
        dependency-type: development
        patterns:
          - vitest
          - "@playwright/test"
          - "@testing-library/*"
          - eslint
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

# .github/workflows/update-visual-baselines.yml
#
# Linux 版 visual-regression baseline を再生成して、実行元の branch へ commit する。
#
# なぜ要るか: baseline は OS ごとに別ファイル（`-darwin.png` / `-linux.png`）で、
# CI が見るのは Linux 側。開発機が macOS だけだと Linux 版を更新できず、意図した
# UI 変更のたびに CI の visual-regression だけが恒久的に赤くなる。赤が常態化した
# gate は「落ちても誰も見ない」ため、gate として死ぬ（`ai_fullstack_development_guardrails_v1.md`）。
#
# **手動実行のみ**（`workflow_dispatch`）。自動実行にしないのは、このジョブが
# 「現在の描画結果を正解として受け入れる」操作だから。意図しない見た目の変化まで
# 承認してしまうため、人間が「この UI 変更は意図したもの」と判断した時だけ動かす。
# 生成された commit の diff は必ずレビューすること。
#
# 使い方:
#   gh workflow run update-visual-baselines.yml --ref <branch>
#
# **実行後に CI は自動で走らない。** GitHub は GITHUB_TOKEN による push では workflow を
# 起動しない（無限ループ防止）ため、下の commit に対する CI run は作られない。緑になったことを
# 確認するには CI を手動で起こすこと:
#   gh workflow run ci.yml --ref <branch>
name: Update visual baselines (Linux)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `ci.yml`の`verify` jobと同じ理由でPostgresが要る: `payload.config.ts`は
    # `CONTENT_SOURCE`の値に関わらず、import時に無条件で`DATABASE_URL`/`PAYLOAD_SECRET`を
    # 要求する（admin/MCP/draft-mode routeが常にbuildへ組み込まれるため）。
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payload_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payload_test
      # CI専用のダミー値。`ci.yml`の`verify` jobと同じ値（外部アカウントに紐づかず、
      # この使い捨てDBの署名にのみ使う）。
      PAYLOAD_SECRET: bd7e747183c90fe80ff7b8136607362ffe54d9e6c2fbd42a
      # このjobはcontent:importを実行しないため、`data/*.ts`（local）でbuildする。
      # `ci.yml`の`verify` jobと同じ既定値（`.env.example`のローカル既定値）。
      CONTENT_SOURCE: payload
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run payload:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      # --update-snapshots は差分があっても exit 0 で終わるため、ここでは失敗させない。
      - name: Regenerate Linux baselines
        run: npx playwright test tests/e2e/visual-regression.spec.ts --update-snapshots

      # 生成物が実際に変わった時だけ commit する（空 commit を作らない）。
      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'tests/e2e/visual-regression.spec.ts-snapshots/*-chromium-linux.png'
          if git diff --cached --quiet; then
            echo "No Linux baseline changes — nothing to commit."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "test(visual): regenerate Linux visual-regression baselines

          Generated by .github/workflows/update-visual-baselines.yml on
          ubuntu-latest, because the darwin dev machine cannot produce
          chromium-linux renderings. Review the image diff before merging —
          this job accepts whatever the current build renders."
          git push

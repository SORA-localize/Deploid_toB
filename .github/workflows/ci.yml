# .github/workflows/ci.yml
name: CI

on:
  pull_request:
  push:
    branches: [main, refactor/integration-20260726]
  # 任意の ref で手動実行できるようにする。
  # GitHub は GITHUB_TOKEN による push では workflow を起動しない（無限ループ防止）ため、
  # update-visual-baselines.yml が baseline を commit しても CI は自動で走らない。
  # baseline 更新後に緑を確認する手段がこれ。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

# .github/workflows/update-visual-snapshots.yml
#
# 一時的なworkflow。visual-regression.spec.tsのLinux(-chromium-linux)snapshotを
# CIと同じ ubuntu-latest 上で生成し、artifactとしてアップロードするだけ。
# 生成後にダウンロードしてcommitしたら、このファイルごと削除する。
name: Update visual snapshots (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test tests/e2e/visual-regression.spec.ts --update-snapshots
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: visual-regression-snapshots-linux
          path: tests/e2e/visual-regression.spec.ts-snapshots/
          retention-days: 3
